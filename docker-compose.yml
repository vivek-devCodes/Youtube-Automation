# docker compose up --build          -> http://localhost (nginx) — app, API, workers, Postgres+pgvector, Redis
# docker compose --profile monitoring up --build   -> also Prometheus (:9090) + Grafana (:3001)
x-backend: &backend
  build: ./backend
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-studio}:${POSTGRES_PASSWORD:-studio}@postgres:5432/${POSTGRES_DB:-studio}
    REDIS_URL: redis://redis:6379/0
    TASK_MODE: celery
    STORAGE_DIR: /data/storage
    PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost}
    CORS_ORIGINS: ${PUBLIC_BASE_URL:-http://localhost}
  volumes:
    - media:/data/storage
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-studio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-studio}
      POSTGRES_DB: ${POSTGRES_DB:-studio}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-studio}"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  backend:
    <<: *backend
    command: ["api"]

  worker:
    <<: *backend
    command: ["worker"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 60s
      timeout: 20s
      start_period: 60s

  beat:
    <<: *backend
    command: ["beat"]
    healthcheck: { disable: true }

  frontend:
    build:
      context: ./frontend
      args: { BACKEND_URL: http://backend:8000 }
    environment: { BACKEND_URL: http://backend:8000 }
    depends_on: [backend]
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports: ["${HTTP_PORT:-80}:80"]
    volumes: ["./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [frontend, backend]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.3.1
    profiles: ["monitoring"]
    volumes: ["./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.6.1
    profiles: ["monitoring"]
    ports: ["3001:3000"]
    environment: { GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD:-change-me}" }

volumes:
  pgdata:
  redisdata:
  media:
